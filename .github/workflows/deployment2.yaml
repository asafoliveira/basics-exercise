name: Deployment Exercise 2
on: push 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v5
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint 
  test:
      - name: Get Code
        uses: actions/checkout@v5
      - name: Install Dependencies
        run: npm ci
      - name: Unit Tests
        run: npm run test 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v5
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint 
      - name: Unit Tests
        run: npm run test
      - name: Build Code
        run: npm run build
      - name: Deploy Code
        run: echo "Deploying..."